name: backend CI

on:
  workflow_call:
  # push:
  #    branches: [Backend]
  # pull_request:
  #   branches: [main, dev]

jobs:
    lint-test-build:
      name: Matrix lint, test and build
      runs-on: ubuntu-24.04
      strategy:
        matrix:
          include:
            - service: accounts
              type: lint

            - service: accounts
              type: test

            - service: accounts
              type: build

            - service: analytics
              type: lint

            - service: analytics
              type: test

            - service: analytics
              type: build

            - service: api
              type: lint

            - service: api
              type: test

            - service: api
              type: build

            - service: company
              type: lint

            - service: company
              type: test

            - service: company
              type: build
            
            - service: comms
              type: lint

            - service: comms
              type: test

            - service: comms
              type: build

            - service: education
              type: lint

            - service: education
              type: test

            - service: education
              type: build

            - service: llm
              type: lint

            - service: llm
              type: test

            - service: llm
              type: build

            - service: mailing
              type: lint

            - service: mailing
              type: test

            - service: mailing
              type: build

            - service: report
              type: lint

            - service: report
              type: test

            - service: report
              type: build

            - service: xp
              type: lint

            - service: xp
              type: test

            - service: xp
              type: build
      steps:
          - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
          - name: Install pnpm
            uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
            with:
              version: 11.1.1
          - name: Use Node.js 24
            uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
            with:
              node-version: 24
              cache: "pnpm"
          - name: Install dependencies
            run: pnpm install --frozen-lockfile --ignore-scripts
          - name: Build shared packages
            run: pnpm build:shared
          - name: ${{ matrix.service }} ${{ matrix.type }}
            run: pnpm run ${{ matrix.type }}:${{ matrix.service }}
          