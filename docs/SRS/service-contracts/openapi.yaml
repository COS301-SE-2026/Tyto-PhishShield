components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }

    HealthStatus:
      type: object
      properties:
        accountsService: { type: string }
        mailingService: { type: string }
        xpService: { type: string }
        reportService: { type: string }
        educationService: { type: string }
        analyticsService: { type: string }

    UserProfile:
      type: object
      required: [auth0Id, email, role]
      properties:
        auth0Id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, analyst, user] }
        name: { type: string }
        department: { type: string, nullable: true }

    LoginResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        requiresOTP: { type: boolean }

    EmailsDto:
      type: object
      required: [sender, subject, content, difficulty]
      properties:
        sender: { type: string, format: email }
        alias: { type: string, description: Optional display name }
        subject: { type: string }
        content: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }

    UpdateEmailDto:
      type: object
      properties:
        sender: { type: string, format: email }
        alias: { type: string }
        subject: { type: string }
        content: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }

    EmailTemplate:
      allOf:
        - $ref: '#/components/schemas/EmailsDto'
        - type: object
          properties:
            referenceNumber: { type: string }
            createdAt: { type: string, format: date-time }

    SendSingleEmailDto:
      type: object
      required: [auth0Id]
      properties:
        auth0Id: { type: string }

    ScheduleSingleEmailDto:
      type: object
      required: [auth0Id, scheduledAt]
      properties:
        auth0Id: { type: string }
        scheduledAt: { type: string, format: date-time }

    SendBatchDto:
      type: object
      required: [auth0Id, difficulty, scheduledFrom, scheduledTo, waveName]
      properties:
        auth0Id: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [easy, medium, hard] }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
        randomisedTimes: { type: boolean, default: false }
        waveName: { type: string }
        referenceNumber: { type: string, description: Optional; if omitted random template is selected }

    SendBatchRandomDto:
      type: object
      required: [auth0Id, difficulty, scheduledFrom, scheduledTo, waveName]
      properties:
        auth0Id: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [easy, medium, hard] }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
        randomisedTimes: { type: boolean, default: false }
        waveName: { type: string }

    GiveXpDto:
      type: object
      required: [auth0Id, amount]
      properties:
        auth0Id: { type: string }
        amount: { type: number, description: Can be negative }
        reason: { type: string }

    MailingResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        deliveryId: { type: string, nullable: true }

    BatchResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    WaveMinimum:
      type: object
      properties:
        waveName: { type: string }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
        sameEmail: { type: boolean }
        randomisedTimes: { type: boolean }
        numberOfRecipients: { type: integer }

    Wave:
      type: object
      properties:
        id: { type: string, format: uuid }
        waveName: { type: string }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
        sameEmail: { type: boolean }
        randomisedTimes: { type: boolean }
        recipients:
          type: array
          items: { type: object, additionalProperties: true }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        outlookMessageId: { type: string, nullable: true }
        emailSubject: { type: string }
        emailSender: { type: string }
        emailBody: { type: string }
        emailReceivedAt: { type: string, format: date-time }
        notes: { type: string }
        status: { type: string, enum: [pending, reviewed, confirmed_phishing, false_positive] }

    XpRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserProfile' }

    NetXpEntry:
      type: object
      properties:
        totalXp: { type: number }
        user: { $ref: '#/components/schemas/UserProfile' }

    AnalyticsOverview:
      type: object
      properties:
        totalEmailsSent: { type: integer }
        totalReports: { type: integer }
        confirmedPhishing: { type: integer }
        falsePositives: { type: integer }
        totalXpGiven: { type: integer }
        educationAssigned: { type: integer }
        educationCompleted: { type: integer }

    ReportStats:
      type: object
      properties:
        submitted: { type: integer }
        confirmed: { type: integer }
        falsePositive: { type: integer }
        detectionRate: { type: number }

    MailingStats:
      type: object
      properties:
        totalSent: { type: integer }
        scheduled: { type: integer }

    TimeSeriesItem:
      type: object
      properties:
        date: { type: string, format: date }
        reports: { type: integer }
        emailsSent: { type: integer }
        xpGiven: { type: integer }

    LeaderboardItem:
      type: object
      properties:
        auth0Id: { type: string }
        email: { type: string }
        totalXp: { type: integer }
        reportCount: { type: integer }

    UserStats:
      type: object
      properties:
        reports: { type: integer }
        confirmed: { type: integer }
        falsePositive: { type: integer }
        totalXp: { type: integer }
        educationCompleted: { type: integer }

    KpiMetric:
      type: object
      properties:
        value: { type: number }
        delta: { type: number }

    AnalyticsSummary:
      type: object
      properties:
        detectionRate: { $ref: '#/components/schemas/KpiMetric' }
        clickRate: { $ref: '#/components/schemas/KpiMetric' }
        totalSimulations: { $ref: '#/components/schemas/KpiMetric' }
        atRiskUsers: { $ref: '#/components/schemas/KpiMetric' }
        trainingCompletion: { $ref: '#/components/schemas/KpiMetric' }

    DetectionRateItem:
      type: object
      properties:
        date: { type: string, format: date }
        detectionRate: { type: number }
        clickRate: { type: number }

    DepartmentStats:
      type: object
      properties:
        department: { type: string }
        sent: { type: integer }
        reported: { type: integer }
        detectionRate: { type: number }
        clickRate: { type: number }

    AtRiskUser:
      type: object
      properties:
        auth0Id: { type: string }
        name: { type: string }
        department: { type: string }
        clickRate: { type: number }
        riskLevel: { type: string, enum: [high, medium] }

    Campaign:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, description: Computed from endDate }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }

    ResendWebhookPayload:
      type: object
      required: [type, data]
      properties:
        type: { type: string }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [email_id]
          properties:
            email_id: { type: string }
            message_id: { type: string }
            from: { type: string }
            to: { type: array, items: { type: string } }
            subject: { type: string }

    uploadDataDto:
      type: object
      required: [file, mapping]
      properties:
        file:
          type: string
          format: binary
          description: The CSV file to upload
        mapping:
          type: string
          description: JSON mapping of system fields to CSV column names.

    UpdateEmployeeDto:
      type: object
      properties:
        employeeId: { type: string, example: u-001 }
        email: { type: string, example: test@example.com }
        firstName: { type: string, example: John }
        lastName: { type: string, example: Doe }
        department: { type: string, example: IT & Security }
        jobTitle: { type: string, example: developer }
        managerEmail: { type: string, example: manager@example.com }
        managerId: { type: string, example: u-002 }
        employeeStatus: { type: string, example: Active }
        externalId: { type: string, example: '0123456' }