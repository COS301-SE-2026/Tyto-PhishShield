      test: ["CMD-SHELL", "pg_isready -U user -d ${LLM_DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'
        reservations:
          cpus: '0.15'
          memory: 64M

    volumes:
      - llm_pgdata:/var/lib/postgresql/data
      - internal_certs:/etc/ssl/certs:ro
      - ./postgres-ssl.conf:/etc/postgresql/postgres-ssl.conf:ro
    ports:
      - "${LLM_DB_PORT}:${INTERNAL_DB_PORT}"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      
# Main service app container
  llm_app:
    build:
      context: ../../
      dockerfile: project/backend/llm-service/Dockerfile

    container_name: ${LLM_APP_CONTAINER}
    environment:
      - PORT=${LLM_SERVICE_PORT}
      - TCP_PORT=${LLM_TCP_PORT}
      - DB_HOST=${LLM_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${LLM_DB_NAME}
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL}
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/llm_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/llm_app.key
      - LOCAL_LLM_URL=http://ollama:11434
    ports:
      - "${LLM_SERVICE_PORT}:${LLM_SERVICE_PORT}"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'

    depends_on:
      llm_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/llm-service/dist:/app/dist
    networks:
      - default
      - local-llm

  company_db:
    image: postgres:15-alpine
    restart: always

    container_name: ${COMPANY_DB_CONTAINER}
    entrypoint: >
      /bin/sh -c "
        cp /etc/ssl/certs/company_db.key /tmp/db.key && \
        cp /etc/ssl/certs/company_db.crt /tmp/db.crt && \
        chmod 600 /tmp/db.key && \
        chown postgres:postgres /tmp/db.key /tmp/db.crt && \
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgres-ssl.conf
      "
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${COMPANY_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ${COMPANY_DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'
        reservations:
          cpus: '0.15'
          memory: 64M

    volumes:
      - company_pgdata:/var/lib/postgresql/data
      - internal_certs:/etc/ssl/certs:ro
      - ./postgres-ssl.conf:/etc/postgresql/postgres-ssl.conf:ro
    ports:
      - "${COMPANY_DB_PORT}:${INTERNAL_DB_PORT}"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      
# Main service app container
  company_app:
    build:
      context: ../../
      dockerfile: project/backend/company-service/Dockerfile

    container_name: ${COMPANY_APP_CONTAINER}
    environment:
      - PORT=${COMPANY_SERVICE_PORT}
      - TCP_PORT=${COMPANY_TCP_PORT}
      - DB_HOST=${COMPANY_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${COMPANY_DB_NAME}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/company_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/company_app.key

    ports:
      - "${COMPANY_SERVICE_PORT}:${COMPANY_SERVICE_PORT}"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'

    depends_on:
      company_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/company-service/dist:/app/dist

  comms_db:
    image: postgres:15-alpine
    restart: always

    # Must have own name
    container_name: ${COMMS_DB_CONTAINER}
    entrypoint: >
      /bin/sh -c "
        cp /etc/ssl/certs/comms_db.key /tmp/db.key && \
        cp /etc/ssl/certs/comms_db.crt /tmp/db.crt && \
        chmod 600 /tmp/db.key && \
        chown postgres:postgres /tmp/db.key /tmp/db.crt && \
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgres-ssl.conf
      "
    # Env variables, must be unique
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${COMMS_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ${COMMS_DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    volumes:
      - comms_pgdata:/var/lib/postgresql/data
      - internal_certs:/etc/ssl/certs:ro
      - ./postgres-ssl.conf:/etc/postgresql/postgres-ssl.conf:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'
        reservations:
          cpus: '0.15'
          memory: 64M

    ports:
      # Left side must be unique
      - "${COMMS_DB_PORT}:${INTERNAL_DB_PORT}"
      
# Main service app container
  comms_app:
    build:
      context: ../../
      dockerfile: project/backend/comms-tracking/Dockerfile

      # Must be unique
    container_name: ${COMMS_APP_CONTAINER}
    environment:
      - PORT=${COMMS_SERVICE_PORT}
      - TCP_PORT=${COMMS_TCP_PORT}
      - DB_HOST=${COMMS_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${COMMS_DB_NAME}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/comms_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/comms_app.key
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}


    ports:
      # Left side must be unique
      - "${COMMS_SERVICE_PORT}:${COMMS_SERVICE_PORT}"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '128M'

    depends_on:
      comms_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/comms-tracking/dist:/app/dist
  
  # builds the website using the website's dockerfile
  website:
    build:
      context: ../../
      dockerfile: project/frontend/website/Dockerfile
      args:
        VITE_API_GATEWAY_URL: "https://localhost"
        VITE_BASE_PATH: "/"
    restart: on-failure
    container_name: website
    ports:
    - '5173:5173'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 192M


  # builds the outlook-addin using its dockerfile
  outlook-addin:
    build: 
      context: ../../
      dockerfile: project/frontend/phishshield-outlook-addin/Dockerfile
      args:
        API_BASE: "https://localhost/api"
        ADDIN_BASE_URL: "https://localhost/addin/"
    restart: on-failure
    container_name: addin
    ports:
      - '3000:8080'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # handles pgadmin access for local developers to view the database on thier machine
  pgadmin:
    image: dpage/pgadmin4:9.15
    restart: always

    # Must be unique
    container_name: PGADMIN_CONTAINER

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_SERVER_JSON_FILE: servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
      - ./.pgpass:/var/lib/pgadmin/.pgpass:ro
    ports:
      - "5050:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  caddy:
    image: caddy:2.11.3
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./local-caddy-conf:/etc/caddy/
      - caddy_logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
      - internal_certs:/etc/caddy/certs:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 32M
    depends_on:
      cert-init:
        condition: service_completed_successfully

  step-ca:
    image: smallstep/step-ca:0.30.2
    container_name: step-ca
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      DOCKER_STEPCA_INIT_NAME: "Internal Microservice CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${PROVISIONER_NAME}
      DOCKER_STEPCA_INIT_PASSWORD_FILE: "/usr/share/step/secrets/password"
      DOCKER_STEPCA_INIT_PROVISIONER_PASSWORD_FILE: "/usr/share/step/secrets/provisioner_password"
    command: step-ca /home/step/config/ca.json --password-file=/usr/share/step/secrets/password
    volumes:
      - step_ca_data:/home/step
      - ./secrets:/usr/share/step/secrets:ro
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 10

  cert-init:
    image: smallstep/step-cli:0.30.6
    container_name: cert-init
    user: "1000:1000"
    depends_on:
      step-ca:
        condition: service_healthy
    volumes:
      - internal_certs:/certs
      - step_ca_data:/ca-root:ro
      - ./secrets:/secrets:ro
    entrypoint: >
      /bin/sh -c "
        set -e
        # Fetch Root CA
        FP=$$(step certificate fingerprint /ca-root/certs/root_ca.crt)
        
        step ca root /certs/root_ca.crt --ca-url https://step-ca:9000 --fingerprint $$FP --force

        # Issue certs for postgresql databases
        step ca certificate mailing_db /certs/mailing_db.crt /certs/mailing_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san mailing_db --san ${MAILING_DB_CONTAINER} --force
        step ca certificate accounts_db /certs/accounts_db.crt /certs/accounts_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san accounts_db --san ${ACCOUNTS_DB_CONTAINER} --force
        step ca certificate analytics_db /certs/analytics_db.crt /certs/analytics_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san analytics_db --san ${ANALYTICS_DB_CONTAINER} --force
        step ca certificate comms_db /certs/comms_db.crt /certs/comms_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san comms_db --san ${COMMS_DB_CONTAINER} --force
        step ca certificate company_db /certs/company_db.crt /certs/company_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san company_db --san ${COMPANY_DB_CONTAINER} --force
        step ca certificate education_db /certs/education_db.crt /certs/education_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san education_db --san ${EDUCATION_DB_CONTAINER} --force
        step ca certificate llm_db /certs/llm_db.crt /certs/llm_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san llm_db --san ${LLM_DB_CONTAINER} --force
        step ca certificate report_db /certs/report_db.crt /certs/report_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san report_db --san ${REPORT_DB_CONTAINER} --force
        step ca certificate xp_db /certs/xp_db.crt /certs/xp_db.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san xp_db --san ${XP_DB_CONTAINER} --force

        # Issue certs for internal services & RabbitMQ
        step ca certificate rabbitmq /certs/rabbitmq.crt /certs/rabbitmq.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san rabbitmq-server --san rabbitmq --force
        
        step ca certificate api_app /certs/api_app.crt /certs/api_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san api_app --san api-gateway --force

        step ca certificate accounts_app /certs/accounts_app.crt /certs/accounts_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${ACCOUNTS_APP_CONTAINER} --force

        step ca certificate mailing_app /certs/mailing_app.crt /certs/mailing_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${MAILING_APP_CONTAINER} --force

        step ca certificate report_app /certs/report_app.crt /certs/report_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${REPORT_APP_CONTAINER} --force

        step ca certificate education_app /certs/education_app.crt /certs/education_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${EDUCATION_APP_CONTAINER} --force

        step ca certificate analytics_app /certs/analytics_app.crt /certs/analytics_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${ANALYTICS_APP_CONTAINER} --force

        step ca certificate xp_app /certs/xp_app.crt /certs/xp_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${XP_APP_CONTAINER} --force

        step ca certificate llm_app /certs/llm_app.crt /certs/llm_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${LLM_APP_CONTAINER} --force

        step ca certificate company_app /certs/company_app.crt /certs/company_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${COMPANY_APP_CONTAINER} --force

        step ca certificate comms_app /certs/comms_app.crt /certs/comms_app.key --ca-url https://step-ca:9000 --root /certs/root_ca.crt --provisioner ${PROVISIONER_NAME} --provisioner-password-file /secrets/provisioner_password --san ${COMMS_APP_CONTAINER} --force

        #Download public Certificates
        curl -s https://cacerts.digicert.com/DigiCertGlobalRootCA.crt.pem >> /certs/root_ca.crt
        curl -s https://www.amazontrust.com/repository/AmazonRootCA1.pem >> /certs/root_ca.crt

        # Grant permissions so database/service containers can read certs
        chmod 644 /certs/*
        echo 'Certificates successfully generated!'
      "

volumes:
  # Must be same as volume name for db
  # Must be hard coded
  api_gateway_logs_v2:
  caddy_data:
  caddy_config:
  caddy_logs:
  mailing_pgdata:
  accounts_pgdata:
  report_pgdata:
  xp_pgdata:
  education_pgdata:
  analytics_pgdata:
  llm_pgdata:
  company_pgdata:
  comms_pgdata:
  pgadmin_data:
  rabbitmq_data:
    driver: local
  step_ca_data:
  internal_certs:

networks:
  local-llm:
    external: true
    name: local-llm