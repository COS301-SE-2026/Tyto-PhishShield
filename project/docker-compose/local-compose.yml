services: 
  # rabbitmq is used to handle the event messaging between services
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped

    container_name: rabbitmq
    hostname: rabbitmq-server
    ports:
      - "5672:5672"
      - "5671:5671" # AMQPS Secure Port
      - "15672:15672"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - internal_certs:/etc/rabbitmq/certs:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # mailing db sets up the mailing service's postgres database
  mailing_db:
    image: postgres:15-alpine
    restart: always

    # Must have own name
    container_name: ${MAILING_DB_CONTAINER}
    entrypoint: >
      /bin/sh -c "
        cp /etc/ssl/certs/mailing_db.key /tmp/db.key && \
        cp /etc/ssl/certs/mailing_db.crt /tmp/db.crt && \
        chmod 600 /tmp/db.key && \
        chown postgres:postgres /tmp/db.key /tmp/db.crt && \
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgres-ssl.conf
      "
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 64M
    depends_on:
      cert-init:
        condition: service_completed_successfully

    # Env variables, must be unique
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${MAILING_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${MAILING_DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    volumes:
      # This must be unique not to override other db's data
      # This must be hard coded
      - mailing_pgdata:/var/lib/postgresql/data
      - ../backend/mailing-service/init-db:/docker-entrypoint-initdb.d
      - internal_certs:/etc/ssl/certs:ro
      - ./postgres-ssl.conf:/etc/postgresql/postgres-ssl.conf:ro
    ports:
      # Left side must be unique
      - "${MAILING_DB_PORT}:${INTERNAL_DB_PORT}"

  # mailing app builds the mailing service from the mailing service's dockerfile
  mailing_app:
    build:
      context: ../../
      dockerfile: project/backend/mailing-service/Dockerfile

      # Must be unique
    container_name: ${MAILING_APP_CONTAINER}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    environment:
      - MAILING_SERVICE_PORT=${MAILING_SERVICE_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - MAILING_DB_CONTAINER=${MAILING_DB_CONTAINER}
      - INTERNAL_DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAILING_DB_NAME=${MAILING_DB_NAME}
      - DB_SYNC=${DB_SYNC}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/mailing_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/mailing_app.key
      - BUSINESS_NAME=${BUSINESS_NAME}
      - TRACKING_LINK=${TRACKING_LINK}

    ports:
      # Left side must be unique
      - "${MAILING_SERVICE_PORT}:${MAILING_SERVICE_PORT}"

    depends_on:
      mailing_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/mailing-service/dist:/app/dist

  # accounts db sets up the accounts service's postgres database
  accounts_db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=${ACCOUNTS_DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ${ACCOUNTS_DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    container_name: ${ACCOUNTS_DB_CONTAINER}
    entrypoint: >
      /bin/sh -c "
        cp /etc/ssl/certs/accounts_db.key /tmp/db.key && \
        cp /etc/ssl/certs/accounts_db.crt /tmp/db.crt && \
        chmod 600 /tmp/db.key && \
        chown postgres:postgres /tmp/db.key /tmp/db.crt && \
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgres-ssl.conf
      "
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 64M
    volumes:
      - accounts_pgdata:/var/lib/postgresql/data
      - internal_certs:/etc/ssl/certs:ro
      - ./postgres-ssl.conf:/etc/postgresql/postgres-ssl.conf:ro
    ports:
      - '${ACCOUNTS_DB_PORT}:${INTERNAL_DB_PORT}'
    depends_on:
      cert-init:
        condition: service_completed_successfully

  # accounts app builds the account service from the account's dockerfile
  accounts_app:
    build:
      context: ../../
      dockerfile: project/backend/accounts-service/Dockerfile
    container_name: ${ACCOUNTS_APP_CONTAINER}
    environment:
      - PORT=${ACCOUNTS_SERVICE_PORT}
      - DB_HOST=${ACCOUNTS_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ACCOUNTS_DB_NAME}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - TCP_PORT=${ACCOUNTS_TCP_PORT}
      - MAILING_SERVICE_URL=https://${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - NODE_ENV=local
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/accounts_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/accounts_app.key
    ports:
      - '${ACCOUNTS_SERVICE_PORT}:${ACCOUNTS_SERVICE_PORT}'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    depends_on:
      accounts_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/accounts-service/dist:/app/dist

  # api app builds the api service from the api's dockerfile
  api_app:
    build:
      context: ../../
      dockerfile: project/backend/api-gateway/Dockerfile
    restart: on-failure
    container_name: ${GATEWAY_APP_CONTAINER}
    environment:
      - VERSION=local-version
      - OUR_EMAIL=${OUR_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - ACCOUNTS_SERVICE_URL=https://${ACCOUNTS_APP_CONTAINER}:${ACCOUNTS_SERVICE_PORT}
      - MAILING_SERVICE_URL=https://${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - XP_SERVICE_URL=https://${XP_APP_CONTAINER}:${XP_SERVICE_PORT}
      - REPORT_SERVICE_URL=https://${REPORT_APP_CONTAINER}:${REPORT_SERVICE_PORT}
      - EDUCATION_SERVICE_URL=https://${EDUCATION_APP_CONTAINER}:${EDUCATION_SERVICE_PORT}
      - ANALYTICS_SERVICE_URL=https://${ANALYTICS_APP_CONTAINER}:${ANALYTICS_SERVICE_PORT}
      - LLM_SERVICE_URL=https://${LLM_APP_CONTAINER}:${LLM_SERVICE_PORT}
      - COMPANY_SERVICE_URL=https://${COMPANY_APP_CONTAINER}:${COMPANY_SERVICE_PORT}
      - COMMS_SERVICE_URL=https://${COMMS_APP_CONTAINER}:${COMMS_SERVICE_PORT}
      - XP_HOST=${XP_APP_CONTAINER}
      - REPORT_HOST=${REPORT_APP_CONTAINER}
      - MAILING_HOST=${MAILING_APP_CONTAINER}
      - ACCOUNTS_HOST=${ACCOUNTS_APP_CONTAINER}
      - EDUCATION_HOST=${EDUCATION_APP_CONTAINER}
      - ANALYTICS_HOST=${ANALYTICS_APP_CONTAINER}
      - LLM_HOST=${LLM_APP_CONTAINER}
      - COMPANY_HOST=${COMPANY_APP_CONTAINER}
      - COMMS_HOST=${COMMS_APP_CONTAINER}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - REPORT_TCP_PORT=${REPORT_TCP_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - ACCOUNTS_TCP_PORT=${ACCOUNTS_TCP_PORT}
      - EDUCATION_TCP_PORT=${EDUCATION_TCP_PORT}
      - ANALYTICS_TCP_PORT=${ANALYTICS_TCP_PORT}
      - LLM_TCP_PORT=${LLM_TCP_PORT}
      - COMPANY_TCP_PORT=${COMPANY_TCP_PORT}
      - COMMS_TCP_PORT=${COMMS_TCP_PORT}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/api_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/api_app.key
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - OUTLOOK_ADDIN_CORS=
      - LOG_DIR=/var/log/api-gateway
      - ENVIRONMENT=local
      - LOCAL_CORS=${LOCAL_CORS}
      - OUTLOOK_ADDIN_CORS=${OUTLOOK_ADDIN_CORS}
    ports:
      - '${API_GATEWAY_PORT}:${API_GATEWAY_PORT}'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 384M
        reservations:
          cpus: '1.0'
          memory: 128M
    volumes:
      - api_gateway_logs_v2:/var/log/api-gateway
      - internal_certs:/etc/ssl/certs:ro
      - ../backend/api-gateway/dist:/app/dist
    depends_on:
      rabbitmq:
        condition: service_healthy

