    ports:
      # Left side must be unique
      - "${XP_DB_PORT}:${INTERNAL_DB_PORT}"

  # xp app build the xp service using the xp dockerfile
  xp_app:
    build:
      context: ../../
      dockerfile: project/backend/xp-service/Dockerfile

      # Must be unique
    container_name: ${XP_APP_CONTAINER}
    environment:
      - XP_SERVICE_PORT=${XP_SERVICE_PORT}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - XP_DB_CONTAINER=${XP_DB_CONTAINER}
      - INTERNAL_DB_PORT=${INTERNAL_DB_PORT}
      - RABBITMQ_URL=amqps://rabbitmq:5671
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/root_ca.crt
      - TLS_CERT_PATH=/etc/ssl/certs/xp_app.crt
      - TLS_KEY_PATH=/etc/ssl/certs/xp_app.key
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - XP_DB_NAME=${XP_DB_NAME}
      - DB_SYNC=${DB_SYNC}

    ports:
      # Left side must be unique
      - "${XP_SERVICE_PORT}:${XP_SERVICE_PORT}"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    depends_on:
