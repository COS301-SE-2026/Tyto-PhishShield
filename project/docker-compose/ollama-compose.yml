services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '4G'
    networks:
      - local-llm

  ollama-pull-model:
    image: ollama/ollama:0.33.3
    container_name: ollama_pull_model
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "sleep 5 && ollama pull gemma2:2b"
    depends_on:
      - ollama
    networks:
      - local-llm
    

volumes:
  ollama_data:
    driver: local

networks:
  local-llm:
    external: true
    name: local-llm