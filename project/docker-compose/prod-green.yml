services:
  mailing_app:
    image: fiveguys301/mailing:v1.0
    container_name: green_${MAILING_APP_CONTAINER}
    environment:
      - MAILING_SERVICE_PORT=${MAILING_SERVICE_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - MAILING_DB_CONTAINER=${MAILING_DB_CONTAINER}
      - INTERNAL_DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAILING_DB_NAME=${MAILING_DB_NAME}
      - DB_SYNC=${DB_SYNC}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - green
      - infrastructure
  
  accounts_app:
    image: fiveguys301/accounts:v1.0
    container_name: green_${ACCOUNTS_APP_CONTAINER}
    environment:
      - PORT=${ACCOUNTS_SERVICE_PORT}
      - DB_HOST=${ACCOUNTS_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ACCOUNTS_DB_NAME}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - TCP_PORT=${ACCOUNTS_TCP_PORT}
      - MAILING_SERVICE_URL=http://${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - NODE_ENV=prod
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    networks:
      - infrastructure
      - green

  api_app1:
    image: fiveguys301/api:v1.0
    restart: on-failure
    container_name: green_${GATEWAY_APP_CONTAINER}_1
    environment:
      - VERSION=green_1-v1.0
      - OUR_EMAIL=${OUR_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - ACCOUNTS_SERVICE_URL=http://green_${ACCOUNTS_APP_CONTAINER}:${ACCOUNTS_SERVICE_PORT}
      - MAILING_SERVICE_URL=http://green_${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - XP_SERVICE_URL=http://green_${XP_APP_CONTAINER}:${XP_SERVICE_PORT}
      - REPORT_SERVICE_URL=http://green_${REPORT_APP_CONTAINER}:${REPORT_SERVICE_PORT}
      - EDUCATION_SERVICE_URL=http://green_${EDUCATION_APP_CONTAINER}:${EDUCATION_SERVICE_PORT}
      - ANALYTICS_SERVICE_URL=http://green_${ANALYTICS_APP_CONTAINER}:${ANALYTICS_SERVICE_PORT}
      - LLM_SERVICE_URL=http://green_${LLM_APP_CONTAINER}:${LLM_SERVICE_PORT}
      - COMPANY_SERVICE_URL=http://green_${COMPANY_APP_CONTAINER}:${COMPANY_SERVICE_PORT}
      - XP_HOST=green_${XP_APP_CONTAINER}
      - REPORT_HOST=green_${REPORT_APP_CONTAINER}
      - MAILING_HOST=green_${MAILING_APP_CONTAINER}
      - ACCOUNTS_HOST=green_${ACCOUNTS_APP_CONTAINER}
      - EDUCATION_HOST=green_${EDUCATION_APP_CONTAINER}
      - ANALYTICS_HOST=green_${ANALYTICS_APP_CONTAINER}
      - LLM_HOST=green_${LLM_APP_CONTAINER}
      - COMPANY_HOST=green_${COMPANY_APP_CONTAINER}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - REPORT_TCP_PORT=${REPORT_TCP_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - ACCOUNTS_TCP_PORT=${ACCOUNTS_TCP_PORT}
      - EDUCATION_TCP_PORT=${EDUCATION_TCP_PORT}
      - ANALYTICS_TCP_PORT=${ANALYTICS_TCP_PORT}
      - LLM_TCP_PORT=${LLM_TCP_PORT}
      - COMPANY_TCP_PORT=${COMPANY_TCP_PORT}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
      - SERVER_DOMAIN=${DOMAIN}
      - OUTLOOK_ADDIN_CORS=
      - ENVIRONMENT=prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${API_GATEWAY_PORT}/api/health').then(async r => { const j = await r.json(); if (r.status != 200) process.exit(1); }).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 384M
        reservations:
          cpus: '1.0'
          memory: 128M
    networks:
      - proxy
      - green
      - infrastructure

  api_app2:
    image: fiveguys301/api:v1.0
    restart: on-failure
    container_name: green_${GATEWAY_APP_CONTAINER}_2
    environment:
      - VERSION=green_2-v1.0
      - OUR_EMAIL=${OUR_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - ACCOUNTS_SERVICE_URL=http://green_${ACCOUNTS_APP_CONTAINER}:${ACCOUNTS_SERVICE_PORT}
      - MAILING_SERVICE_URL=http://green_${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - XP_SERVICE_URL=http://green_${XP_APP_CONTAINER}:${XP_SERVICE_PORT}
      - REPORT_SERVICE_URL=http://green_${REPORT_APP_CONTAINER}:${REPORT_SERVICE_PORT}
      - EDUCATION_SERVICE_URL=http://green_${EDUCATION_APP_CONTAINER}:${EDUCATION_SERVICE_PORT}
      - ANALYTICS_SERVICE_URL=http://green_${ANALYTICS_APP_CONTAINER}:${ANALYTICS_SERVICE_PORT}
      - LLM_SERVICE_URL=http://green_${LLM_APP_CONTAINER}:${LLM_SERVICE_PORT}
      - COMPANY_SERVICE_URL=http://green_${COMPANY_APP_CONTAINER}:${COMPANY_SERVICE_PORT}
      - XP_HOST=green_${XP_APP_CONTAINER}
      - REPORT_HOST=green_${REPORT_APP_CONTAINER}
      - MAILING_HOST=green_${MAILING_APP_CONTAINER}
      - ACCOUNTS_HOST=green_${ACCOUNTS_APP_CONTAINER}
      - EDUCATION_HOST=green_${EDUCATION_APP_CONTAINER}
      - ANALYTICS_HOST=green_${ANALYTICS_APP_CONTAINER}
      - LLM_HOST=green_${LLM_APP_CONTAINER}
      - COMPANY_HOST=green_${COMPANY_APP_CONTAINER}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - REPORT_TCP_PORT=${REPORT_TCP_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - ACCOUNTS_TCP_PORT=${ACCOUNTS_TCP_PORT}
      - EDUCATION_TCP_PORT=${EDUCATION_TCP_PORT}
      - ANALYTICS_TCP_PORT=${ANALYTICS_TCP_PORT}
      - LLM_TCP_PORT=${LLM_TCP_PORT}
      - COMPANY_TCP_PORT=${COMPANY_TCP_PORT}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
      - SERVER_DOMAIN=${DOMAIN}
      - OUTLOOK_ADDIN_CORS=
      - ENVIRONMENT=prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${API_GATEWAY_PORT}/api/health').then(async r => { const j = await r.json(); if (r.status != 200) process.exit(1); }).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 384M
        reservations:
          cpus: '1.0'
          memory: 128M
    networks:
      - proxy
      - green
      - infrastructure

  report_app:
    image: fiveguys301/report:v1.0
    container_name: green_${REPORT_APP_CONTAINER}
    environment:
      - PORT=${REPORT_SERVICE_PORT}
      - TCP_PORT=${REPORT_TCP_PORT}
      - DB_HOST=${REPORT_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}  
      - DB_PASSWORD=${DB_PASSWORD} 
      - DB_NAME=${REPORT_DB_NAME}  
      - AUTH0_DOMAIN=${AUTH0_DOMAIN} 
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE} 
      - REPORT_DB_PORT=${INTERNAL_DB_PORT}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    networks:
      - green
      - infrastructure

  xp_app:
    image: fiveguys301/xp:v1.0
    container_name: green_${XP_APP_CONTAINER}
    environment:
      - XP_SERVICE_PORT=${XP_SERVICE_PORT}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - XP_DB_CONTAINER=${XP_DB_CONTAINER}
      - INTERNAL_DB_PORT=${INTERNAL_DB_PORT}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - XP_DB_NAME=${XP_DB_NAME}
      - DB_SYNC=${DB_SYNC}
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - green
      - infrastructure
      
  education_app:
    image: fiveguys301/education:v1.0
    container_name: green_${EDUCATION_APP_CONTAINER}
    environment:
      - PORT=${EDUCATION_SERVICE_PORT}
      - TCP_PORT=${EDUCATION_TCP_PORT}
      - DB_HOST=${EDUCATION_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${EDUCATION_DB_NAME}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    volumes:
      - ./src:/app/src
    networks:
      - green
      - infrastructure
      
  analytics_app:
    image: fiveguys301/analytics:v1.0
    container_name: green_${ANALYTICS_APP_CONTAINER}
    environment:
      - PORT=${ANALYTICS_SERVICE_PORT}
      - TCP_PORT=${ANALYTICS_TCP_PORT}
      - DB_HOST=${ANALYTICS_DB_CONTAINER}
      - DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ANALYTICS_DB_NAME}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '256M'
    networks:
      - green
      - infrastructure

  website:
    image: fiveguys301/website:v1.0
    restart: on-failure
    container_name: green_website
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 192M
    networks:
      - green
      - proxy
  
  outlook_addin:
    image: fiveguys301/addin:v1.0
    restart: on-failure
    container_name: green_addin
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - green
      - proxy

networks:
  proxy:
    external: true
    name: proxy
  green:
    external: true
    name: green
  infrastructure:
    external: true
    name: infrastructure