      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - TCP_PORT=${ACCOUNTS_TCP_PORT}
      - MAILING_SERVICE_URL=http://${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - NODE_ENV=prod
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    networks:
      - infrastructure
      - green

  api_app1:
    image: fiveguys301/api:fe99ecf12edd6da36cffd7e70bfb52111354e1b0
    restart: on-failure
    container_name: green_${GATEWAY_APP_CONTAINER}_1
    environment:
      - VERSION=green_1-fe99ecf12edd6da36cffd7e70bfb52111354e1b0
      - OUR_EMAIL=${OUR_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_RECEIVED_WEBHOOK_SECRET=${RESEND_RECEIVED_WEBHOOK_SECRET}
      - RESEND_WEBHOOK_SKIP_VERIFY=${RESEND_WEBHOOK_SKIP_VERIFY}
      - NODE_ENV=${ENVIRONMENT}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - ACCOUNTS_SERVICE_URL=http://green_${ACCOUNTS_APP_CONTAINER}:${ACCOUNTS_SERVICE_PORT}
      - MAILING_SERVICE_URL=http://green_${MAILING_APP_CONTAINER}:${MAILING_SERVICE_PORT}
      - XP_SERVICE_URL=http://green_${XP_APP_CONTAINER}:${XP_SERVICE_PORT}
      - REPORT_SERVICE_URL=http://green_${REPORT_APP_CONTAINER}:${REPORT_SERVICE_PORT}
      - EDUCATION_SERVICE_URL=http://green_${EDUCATION_APP_CONTAINER}:${EDUCATION_SERVICE_PORT}
      - ANALYTICS_SERVICE_URL=http://green_${ANALYTICS_APP_CONTAINER}:${ANALYTICS_SERVICE_PORT}
      - LLM_SERVICE_URL=http://green_${LLM_APP_CONTAINER}:${LLM_SERVICE_PORT}
      - COMPANY_SERVICE_URL=http://green_${COMPANY_APP_CONTAINER}:${COMPANY_SERVICE_PORT}
      - COMMS_SERVICE_URL=http://green_${COMMS_APP_CONTAINER}:${COMMS_SERVICE_PORT}
      - XP_HOST=green_${XP_APP_CONTAINER}
      - REPORT_HOST=green_${REPORT_APP_CONTAINER}
      - MAILING_HOST=green_${MAILING_APP_CONTAINER}
      - ACCOUNTS_HOST=green_${ACCOUNTS_APP_CONTAINER}
      - EDUCATION_HOST=green_${EDUCATION_APP_CONTAINER}
      - ANALYTICS_HOST=green_${ANALYTICS_APP_CONTAINER}
      - LLM_HOST=green_${LLM_APP_CONTAINER}
      - COMPANY_HOST=green_${COMPANY_APP_CONTAINER}
      - COMMS_HOST=green_${COMMS_APP_CONTAINER}
      - XP_TCP_PORT=${XP_TCP_PORT}
      - REPORT_TCP_PORT=${REPORT_TCP_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - ACCOUNTS_TCP_PORT=${ACCOUNTS_TCP_PORT}
      - EDUCATION_TCP_PORT=${EDUCATION_TCP_PORT}
      - ANALYTICS_TCP_PORT=${ANALYTICS_TCP_PORT}
      - LLM_TCP_PORT=${LLM_TCP_PORT}
      - COMPANY_TCP_PORT=${COMPANY_TCP_PORT}
      - COMMS_TCP_PORT=${COMMS_TCP_PORT}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
      - SERVER_DOMAIN=${DOMAIN}
      - OUTLOOK_ADDIN_CORS=
      - ENVIRONMENT=prod
      - LOG_DIR=/var/log/api-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${API_GATEWAY_PORT}/api/health').then(async r => { const j = await r.json(); if (r.status != 200) process.exit(1); }).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 384M
        reservations:
          cpus: '1.0'
          memory: 128M
    networks:
      - proxy
      - green
      - infrastructure

