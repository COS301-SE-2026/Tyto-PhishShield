services:
  mailing_app:
    image: fiveguys301/mailing:fe99ecf12edd6da36cffd7e70bfb52111354e1b0
    container_name: green_${MAILING_APP_CONTAINER}
    environment:
      - MAILING_SERVICE_PORT=${MAILING_SERVICE_PORT}
      - MAILING_TCP_PORT=${MAILING_TCP_PORT}
      - MAILING_DB_CONTAINER=${MAILING_DB_CONTAINER}
      - INTERNAL_DB_PORT=${INTERNAL_DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAILING_DB_NAME=${MAILING_DB_NAME}
      - DB_SYNC=${DB_SYNC}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL_DELIVERED=${RESEND_EMAIL_DELIVERED}
      - RESEND_EMAIL=${RESEND_EMAIL}
      - RABBITMQ_URL=amqp://prod_rabbitmq:5672
      - BUSINESS_NAME=${BUSINESS_NAME}
      - TRACKING_LINK=${TRACKING_LINK}
      - BUSINESS_SENDING_DOMAIN=${BUSINESS_SENDING_DOMAIN}
      - SCHEDULE_MIN_LEAD_MINUTES=${SCHEDULE_MIN_LEAD_MINUTES}
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - green
      - infrastructure
  
  accounts_app:
    image: fiveguys301/accounts:fe99ecf12edd6da36cffd7e70bfb52111354e1b0
