volumes:
  # Must be same as volume name for db
  # Must be hard coded
  prod_mailing_pgdata:
  prod_accounts_pgdata:
  prod_xp_pgdata:
  prod_report_pgdata:
  prod_education_pgdata:
  prod_analytics_pgdata:
  prod_llm_pgdata:
  prod_company_pgdata:
  prod_caddy_data:
  prod_caddy_config:
  prod_caddy_logs:
  prod_rabbitmq_data:
    driver: local

networks:
  proxy:
    external: true
    name: proxy

  infrastructure:
    external: true
    name: infrastructure