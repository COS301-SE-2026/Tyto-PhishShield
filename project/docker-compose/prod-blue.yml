      - ACCOUNTS_HOST=blue_${ACCOUNTS_APP_CONTAINER}
      - EDUCATION_HOST=blue_${EDUCATION_APP_CONTAINER}
      - ANALYTICS_HOST=blue_${ANALYTICS_APP_CONTAINER}
