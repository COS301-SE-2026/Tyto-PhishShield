services:
  stalwart:
    image: stalwartlabs/stalwart:v0.15
    container_name: stalwart
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:8080" 
      - "25:25"               
      - "587:587"             
      - "993:993"            
    volumes:
      - ./data:/opt/stalwart-mail
      - /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.example-compnay.xyz/